name: diag

on:
  workflow_dispatch:
  push:
    branches: [diag-tmp]

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: env
        run: |
          go version
          /bin/sh -c 'echo shell=$0; readlink -f /bin/sh; printf "hex8Test: "; printf "ok\xffbad" | od -An -c | head -1'
      - name: cookiejar probe
        run: |
          mkdir -p /tmp/probe && cd /tmp/probe
          cat > main.go <<'EOF'
          package main

          import (
              "fmt"
              "net/http"
              "net/http/cookiejar"
              "net/http/httptest"
              "strings"
          )

          func main() {
              mux := http.NewServeMux()
              mux.HandleFunc("POST /api/v1/login", func(w http.ResponseWriter, r *http.Request) {
                  http.SetCookie(w, &http.Cookie{Name: "swarmmind_session", Value: "sid123", Path: "/", HttpOnly: true, SameSite: http.SameSiteLaxMode})
                  fmt.Fprint(w, `{"ok":true}`)
              })
              mux.HandleFunc("GET /api/v1/nodes/enroll-info", func(w http.ResponseWriter, r *http.Request) {
                  if _, err := r.Cookie("swarmmind_session"); err != nil {
                      w.WriteHeader(401)
                      fmt.Fprint(w, "no-cookie")
                      return
                  }
                  fmt.Fprint(w, "cookie-ok")
              })
              srv := httptest.NewServer(mux)
              defer srv.Close()
              jar, _ := cookiejar.New(nil)
              hc := &http.Client{Jar: jar}
              resp, err := hc.Post(srv.URL+"/api/v1/login", "application/json", strings.NewReader(`{"token":"x"}`))
              if err != nil { panic(err) }
              resp.Body.Close()
              fmt.Println("login status:", resp.StatusCode)
              u := srv.URL + "/api/v1/nodes/enroll-info"
              req, _ := http.NewRequest(http.MethodGet, u, nil)
              req.Host = "console.example:64309"
              fmt.Println("jar cookies before GET:", jar.Cookies(req.URL))
              resp2, err := hc.Do(req)
              if err != nil { panic(err) }
              body := make([]byte, 64)
              n, _ := resp2.Body.Read(body)
              fmt.Println("GET status:", resp2.StatusCode, "body:", string(body[:n]))
          }
          EOF
          go mod init probe >/dev/null 2>&1
          go run main.go
      - name: failed tests verbose
        run: |
          go test -race -run 'TestEnrollInfo|TestRunUTF8Sanitize' -v ./internal/hub/api/ ./internal/node/runner/ 2>&1 | tail -40
