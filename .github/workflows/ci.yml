name: CI

on:
  push:
    branches: [main]
    tags: ['v*']   # tag 推送触发发布（v* 前缀，防任意 tag 误发）
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test (race)
        run: go test -race ./...

  # 发布：tag 推送自动触发；workflow_dispatch 手动触发（验收路径，不打真实 tag）。
  # 产物清单单源 scripts/release.sh，与 Makefile release 完全一致，勿在此手写 GOOS 构建行。
  release:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Embed prebuilt nodes
        run: make embed-nodes
      - name: Cross build (single-source matrix)
        run: bash scripts/release.sh dist
      - uses: softprops/action-gh-release@v2
        # 仅 tag push 真发布：workflow_dispatch 可指定 tag ref，若只判 ref 会误发布（手动触发仅验证构建）
        if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
        with:
          files: |
            dist/*
            internal/hub/api/embedded/*.gz
          generate_release_notes: true
