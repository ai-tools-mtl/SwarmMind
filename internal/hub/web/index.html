<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SwarmMind · 中心端</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
<div class="brand"><img class="brand-logo" src="/logo.svg" alt="" width="30" height="30">SwarmMind<span class="chip"> 中心端</span></div>
<div class="deploy">任务在各台机器本机执行</div>   <!-- B8 meta 降噪：登记与监管职责说明留侧栏底部一句 -->
<div class="top-right"><span id="session-left" class="muted small"></span><div id="notify-bell" hidden>
<button id="notify-bell-btn" class="bell-btn" data-act="bell-toggle" aria-label="站内通知" title="站内通知（重启后清空）"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span id="notify-badge" class="bell-badge" hidden></span></button>
<div id="notify-panel" class="notify-panel" hidden></div>
</div><button id="logout" class="link" hidden>退出登录</button></div>
</header>
<div id="app"><main><div class="card login"><h1>SwarmMind</h1><p class="muted">正在连接管理面…</p></main></div></div>
<div id="layer"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="/app.js"></script>
</body>
</html>
