<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SwarmMind · Node 本地控制台</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
<div class="brand"><b>⌘</b>SwarmMind<span class="chip"> / NODE CONSOLE</span></div>
<div id="conn-chip" class="badge offline" hidden>离线</div>
<div class="deploy">本机控制台（127.0.0.1:8445 回环）：本机 agent 的暴露开关、派任务与我的任务、运行状态。</div>
<div class="top-right"><span id="who" class="muted small"></span><button id="logout" class="link" hidden>换令牌</button></div>
</header>
<div id="app"><main><div class="card login"><h1>SwarmMind Node</h1><p class="muted">正在连接本机 API…</p></div></main></div>
<div id="layer"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script src="/app.js"></script>
</body>
</html>
