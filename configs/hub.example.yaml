node_listen: 127.0.0.1:8443       # node 接入端口；insecure_loopback=true 时必须为回环地址且 hub_url 用 ws://
api_listen: 127.0.0.1:8444        # 管理台端口；只在本机用保持回环即可。绑到内网/公网地址必须已配置 admin_token（明文 HTTP，启动时会打印警告，建议前置 TLS 反代）
tls:
  insecure_loopback: true         # true = 开发模式：明文 ws + 强制回环监听。false（生产）= TLS 模式，证书由 hub 首次启动自动生成在 data_dir（hub_cert.pem / hub_key.pem），无需手写
nodes:                            # 每台节点一行：node_id → 接入令牌（管理台「节点接入」向导会生成这两行）
  mac-mini: token-for-mac-mini
  win-box: token-for-win-box
admin_token: ""                   # 管理台登录令牌（浏览器登录与 swarmmindctl --token 用）；留空则启动时自动生成存 data_dir/admin_token
data_dir: data
notify:                           # 任务终态 IM 通知（可选）：任务进入终态（完成/失败/拿不准/取消）时推送一条消息；异步发送失败重试 3 次后放弃，绝不影响任务本身
  webhook_url: ""                 # webhook 地址（飞书自定义机器人：群设置→机器人→自定义机器人，复制 https://open.feishu.cn/open-apis/bot/v2/hook/xxx）；留空=禁用
  format: raw                     # raw=结构化 JSON（event=task_final，机器可读）；feishu=飞书机器人文本消息（一行人话摘要，如「✅ 任务完成 t-abc123 · mac-mini/coder · 耗时 3m20s」）
