<body>
<header class="topbar">

<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const states = {submitted:'已提交',offered:'已投递',acknowledged:'已接收',running:'执行中',completed:'已完成',failed:'执行失败',needs_review:'待人工核对'};
const errors = {timeout:'执行超过本机配置的超时上限，进程组已终止',policy_denied:'参数或环境变量超出本机白名单，未执行',expired:'离线任务超过 7 天保留期',agent_not_found:'执行节点配置已变化，找不到该 agent',agent_not_exposed:'本机主人关闭接入，新任务不再准入',truncated:'结果超过编码预算，答复或诊断日志已截断'};
const nodes = [
{id:'mac-mini',online:true,epoch:12,heartbeat:'2 秒前',window:2,mail:3,bytes:0.4},
{id:'studio-linux',online:true,epoch:7,heartbeat:'5 秒前',window:1,mail:1,bytes:0.2},
{id:'travel-mac',online:false,epoch:4,heartbeat:'38 分钟前',window:0,mail:2,bytes:0.3}
];
const agents = [
{id:'codex-review',node:'mac-mini',desc:'代码审查 · 找出潜在缺陷',mode:'只读沙箱 · read-only',exposed:true,desired:true,pending:false,calls:24},
{id:'claude-code',node:'mac-mini',desc:'实现功能 · 编写与修复代码',mode:'工作区写入 · workspace-write',exposed:true,desired:true,pending:false,calls:12},
{id:'test-runner',node:'studio-linux',desc:'运行测试 · 生成验证报告',mode:'受限命令 · allowlist',exposed:true,desired:true,pending:false,calls:18},
{id:'doc-writer',node:'studio-linux',desc:'文档整理 · 输出 Markdown',mode:'工作区写入 · workspace-write',exposed:true,desired:true,pending:false,calls:8},
{id:'opencode',node:'travel-mac',desc:'离线开发机 · 小型重构',mode:'工作区写入 · workspace-write',exposed:true,desired:true,pending:false,calls:3},
{id:'fleet-inspector',node:'hub-control',desc:'全网健康巡检 · hub 自有',mode:'控制 node · 管理员批准',exposed:true,desired:true,pending:false,calls:2}
];
const seeds = [
['needs_review','数据库迁移执行中断','mac-mini','claude-code','','mac-mini'],
['needs_review','依赖锁文件更新中断','mac-mini','codex-review','','mac-mini'],
['running','审查支付回调的幂等逻辑','mac-mini','codex-review','','mac-mini'],
['running','验证 Linux 构建产物','studio-linux','test-runner','','mac-mini'],
['submitted','整理离线开发机上的重构建议','travel-mac','opencode','','mac-mini'],
['submitted','检查离线分支差异','travel-mac','opencode','','studio-linux'],
['offered','补充 API 契约说明','studio-linux','doc-writer','','mac-mini'],
['acknowledged','审查会话恢复路径','mac-mini','codex-review','','mac-mini'],
['completed','生成状态机测试报告','studio-linux','test-runner','','mac-mini'],
['completed','整理部署指引','studio-linux','doc-writer','','travel-mac'],
['failed','长耗时集成测试','studio-linux','test-runner','timeout','mac-mini'],
['failed','覆盖受保护环境变量','mac-mini','claude-code','policy_denied','mac-mini'],
['failed','过期的离线任务','travel-mac','opencode','expired','mac-mini'],
['failed','调用已移除的 agent','studio-linux','old-agent','agent_not_found','mac-mini'],
['failed','向已下线服务派单','mac-mini','retired-agent','agent_not_exposed','studio-linux'],
['completed','大型代码库审查摘要','mac-mini','codex-review','truncated','mac-mini']
];
let tasks = seeds.map((s,i)=>({id:'t-'+String(i+1).padStart(4,'0'),trace_id:'trace-'+String(7901+i),status:s[0],title:s[1],target_node:s[2],target_agent:s[3],error:s[4],submitted_by:s[5],created_at:`2026-10-21T0${Math.floor(i/4)+1}:${String(i*3%60).padStart(2,'0')}:00Z`,input:{args:[],env:{},stdin:s[1]},idem:'demo-'+(i+1),review:null}));
// 仅声明有证据的事件；不根据当前状态补造 offer/ack/start 时间。
tasks.forEach((t,i)=>{t.events=[['提交持久化 · submit_ack',t.created_at]];if(['offered','acknowledged','running'].includes(t.status))t.events.push(['已投递 · task_offer','2026-10-21T06:00:02Z']);if(['acknowledged','running'].includes(t.status))t.events.push(['账本已接收 · task_ack','2026-10-21T06:00:03Z']);if(t.status==='running'||t.status==='needs_review')t.events.push(['执行开始 · task_started','2026-10-21T06:00:04Z']);if(terminal(t))t.events.push([states[t.status]+' · task_result','2026-10-21T06:02:00Z']);if(t.status==='needs_review'){t.error='node_restarted_midway';t.scene=i===0?'06:00 开始执行数据库迁移；写入迁移记录后 mac-mini 意外重启。账本 started 未 finished，无法确认事务是否提交。请检查数据库版本与迁移记录。':'06:00 更新 package-lock.json 时系统内核崩溃；重启发现 started 记录。文件可能只写入了一部分，请检查 git diff 并验证依赖锁文件。';}t.answer=t.status==='completed'?'已完成任务。检查结果：主要流程通过；建议补充断线恢复与边界条件验证。详细报告见产物。':t.status==='failed'?'本次未完成交付：'+(errors[t.error]||t.error):'尚无已确认的最终答复。';t.stdout='[diagnostic] task '+t.id+' · runner initialized\n'+(t.status==='needs_review'?'last persisted state: started\nconnection lost; restart recovered':'stdout tail: evidence snapshot');t.artifacts=t.status==='completed'?[{name:'report.md',state:'可取回',content:'# 验证报告\n主要流程通过，详见 FinalAnswer。'},{name:'offline-notes.txt',state:'来源离线',source:'travel-mac'},{name:'previous-build.zip',state:'已清理'},{name:'changed-result.json',state:'校验失败'}]:[];});
let view='node',page='overview',auth={node:false,hub:false},filter='',traceFilter='',byFilter='',errorFilter='',firstUse=false,selectedTask=null,returnFocus=null;
let draft,submitState='ready',submitMessage='',confirmedId=null,uncertainTask=null,submitSerial=0;
let inspection={stage:'idle',snapshot:[],time:null};
const menus={node:[['overview','总览'],['dispatch','派任务'],['tasks','我的任务'],['services','我的服务'],['ops','运维']],hub:[['overview','总览'],['nodes','节点接入'],['tasks','任务监管'],['control','运维控制'],['policy','策略容量']]};
function key(){return 'journey-'+(globalThis.crypto?.randomUUID?.()||Date.now()+'-'+Math.random().toString(36).slice(2));}
function freshDraft(){draft={agent:'studio-linux/test-runner',prompt:'',args:'[]',env:'{}',stdin:'',idem:key(),scenario:'ok',search:''};submitState='ready';submitMessage='';confirmedId=null;uncertainTask=null;}
freshDraft();
function terminal(t){return ['completed','failed','needs_review'].includes(t.status);}
function badge(s){return `<span class="badge ${esc(s)}">${esc(states[s])} · ${esc(s)}</span>`;}
function online(n){return `<span class="badge ${n.online?'online':'offline'}">${n.online?'在线 · online':'离线 · offline'}</span>`;}
function toast(msg){$('#toast').textContent=msg;$('#toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').hidden=true,3200);}
function button(label,action,cls='',extra=''){return `<button class="${cls}" data-action="${action}" ${extra}>${label}</button>`;}
function head(title,desc,action=''){return `<div class="page-head"><div><div class="eyebrow">${view==='node'?'YOUR LOCAL WORKSPACE':'NETWORK ADMINISTRATION'}</div><h1>${title}</h1><p class="muted">${desc}</p></div><div class="actions">${action}</div></div>`;}
function metric(label,value,desc){return `<div class="card"><small>${label}</small><div class="metric">${value}</div><small>${desc}</small></div>`;}
function mine(){return tasks.filter(t=>t.submitted_by==='mac-mini');}
function reviewCount(){return (view==='node'?tasks.filter(t=>t.target_node==='mac-mini'):tasks).filter(t=>t.status==='needs_review'&&!t.review).length;}
function go(p,f=''){page=p;filter=f;traceFilter=byFilter=errorFilter='';closeLayer();render();window.scrollTo(0,0);}
function render(){
 document.querySelectorAll('[data-view]').forEach(b=>{b.classList.toggle('selected',b.dataset.view===view);b.setAttribute('aria-pressed',String(b.dataset.view===view));});
 $('#logout').hidden=!auth[view];
 if(!auth[view]){renderLogin();return;}
 $('#app').innerHTML=`<div class="shell"><aside><div class="workspace"><small>${view==='node'?'本机工作空间':'协作网 · 管理员'}</small><strong>${view==='node'?'● mac-mini':'◈ SwarmMind Hub'}</strong></div><nav aria-label="旅程导航">${menus[view].map(([id,name],i)=>`<button data-page="${id}" class="${page===id?'active':''}" ${page===id?'aria-current="page"':''}><span class="navnum">0${i+1}</span>${name}${id==='tasks'&&reviewCount()?` <small>(${reviewCount()})</small>`:''}</button>`).join('')}</nav><div class="aside-bottom">${view==='node'?'127.0.0.1:8445<br>本机执行权由你掌握':'127.0.0.1:8444<br>控制面 · 不承载用户任务'}<hr>协议 v1 · 演示数据<br>所有操作仅在当前页面内模拟</div></aside><main id="main">${renderPage()}</main></div>`;
}
function renderLogin(){
 $('#app').innerHTML=`<main><div class="card login"><div class="mark">⌘</div><div class="eyebrow">${view==='hub'?'HUB ADMIN ACCESS':'LOCAL NODE ACCESS'}</div><h1>${view==='hub'?'管理你的协作网':'回到本机工作空间'}</h1><p class="muted">${view==='hub'?'管理员令牌登录后，可管理接入、监管任务与运行巡检。':'使用本机管理令牌，派任务、提供服务并核对执行结果。'}</p><form id="login-form"><label>访问令牌<input id="token" type="password" placeholder="输入任意非空令牌体验" autocomplete="off" required></label><div id="login-feedback" class="statusline" role="status"></div><button class="primary" type="submit">进入${view==='hub'?' Hub 中心端':' Node 本地控制台'} →</button></form><p class="footer-note">交互演示：任意非空令牌可进；两端独立登录。<br>实际部署为两个独立站点，node 仅回环访问。</p></div></main>`;
}
function renderPage(){if(page==='overview')return overview();if(page==='tasks')return taskPage();if(view==='node')return ({dispatch:dispatchPage,services:servicePage,ops:opsPage}[page]||overview)();return ({nodes:nodePage,control:controlPage,policy:policyPage}[page]||overview)();}
function overview(){
 if(view==='hub')return head('让协作网有序运转','3 个节点，6 项能力；关注交付，也关注异常。',button('＋ 接入节点','enroll','primary'))+`<div class="grid cols4">${metric('全网任务',tasks.length,'当前快照 · 终态保留 24h')}${metric('正在执行',tasks.filter(t=>t.status==='running').length,'断线不终止已开始任务')}${metric('已完成',tasks.filter(t=>t.status==='completed').length,'完整答复与产物引用')}${metric('等待主人核对',reviewCount(),button('查看 needs_review 待办 →','reviews','link'))}</div><div class="grid cols2 spaced"><section class="card"><div class="row"><h2>全网拓扑</h2><small>2 在线 / 1 离线</small></div><div class="topology"><div class="hub-icon">◈<br><b>Hub</b><br><small>中继与控制</small></div><div class="nodes">${nodes.map(n=>`<div class="node-line"><strong>${n.id}</strong>${online(n)}</div>`).join('')}</div></div><small>node 主动外连 hub；hub 不持有机器执行权。</small></section><section class="card"><h2>需要你关注</h2><div class="notice purple"><b>${reviewCount()} 条执行结果不确定</b><p>等待本机主人核对，禁止自动重新执行。</p>${button('进入核对队列 →','reviews','link')}</div><div class="notice warn spaced">travel-mac 离线 38 分钟，2 条任务在信箱等待重连。${button('查看节点 →','node-list','link')}</div><p class="footer-note">异常看板可下钻任务监管；核对在执行 node 本机完成。</p></section></div><section class="card spaced"><div class="row"><h2>最新任务流</h2>${button('查看全网任务 →','all-tasks','link')}</div>${taskTable(tasks.slice(0,5))}</section>`;

function available(){return agents.filter(a=>a.node!=='hub-control'&&a.exposed);}
function dispatchPage(){
 const locked=['unknown','submitting','confirmed'].includes(submitState), opts=available().filter(a=>(a.node+' '+a.id+' '+a.desc).toLowerCase().includes(draft.search.toLowerCase())||a.node+'/'+a.id===draft.agent);
 const a=agents.find(a=>a.node+'/'+a.id===draft.agent), n=nodes.find(n=>n.id===a?.node);
 const label={ready:'确认并提交',submitting:'提交中… 请勿重复操作',confirmed:'查看任务',failed:'修正后重试',unknown:'同键重试'}[submitState];
 return head('把任务交给合适的 Agent','选择能力，一次给足上下文。执行配置始终留在对方本机。')+`<div class="grid" style="grid-template-columns:minmax(0,2fr) minmax(220px,1fr)"><section class="card"><form id="dispatch-form"><fieldset ${locked?'disabled':''}><label>发现网内能力<input data-draft="search" value="${esc(draft.search)}" placeholder="搜索能力、agent 或节点"></label><label>能力目录 · 仅已注册且已暴露的 Agent<select data-draft="agent">${opts.map(a=>`<option value="${a.node}/${a.id}" ${draft.agent===a.node+'/'+a.id?'selected':''}>${a.id} @ ${a.node} — ${esc(a.desc)}</option>`).join('')}</select></label><div class="notice"><b>${esc(a?.mode||'请重新选择能力')}</b><br>${n?.online?'在线 · online：提交后进入投递与执行队列。':'离线 · offline：任务进入离线信箱，重连后补推；超过 7 天过期。'}<br><small>非交互式执行；不支持过程中澄清或审批。</small></div><label class="spaced">任务描述<textarea data-draft="prompt" rows="6" placeholder="例如：审查支付回调的重复投递处理，给出风险与建议。">${esc(draft.prompt)}</textarea></label><details><summary>高级选项 · args / env / stdin / idem_key</summary><label>args · JSON 数组<input data-draft="args" value="${esc(draft.args)}"></label><label>env · JSON 对象<input data-draft="env" value="${esc(draft.env)}"></label><label>stdin · 可选（留空使用任务描述）<textarea data-draft="stdin">${esc(draft.stdin)}</textarea></label><label>idem_key · 自动生成<input data-draft="idem" value="${esc(draft.idem)}" readonly></label><small>参数与环境变量仍受目标 node 本机白名单约束。</small></details><label>演示响应场景<select data-draft="scenario"><option value="ok" ${draft.scenario==='ok'?'selected':''}>确认成功 · 202</option><option value="400" ${draft.scenario==='400'?'selected':''}>明确失败 · 400 输入超限</option><option value="409" ${draft.scenario==='409'?'selected':''}>明确失败 · 409 同键内容冲突</option><option value="503" ${draft.scenario==='503'?'selected':''}>明确失败 · 503 信箱已满</option><option value="unknown" ${draft.scenario==='unknown'?'selected':''}>结果未知 · 确认包丢失</option></select></label></fieldset><div id="submit-feedback" class="statusline" role="status">${submissionFeedback()}</div><div class="actions"><button class="primary" type="submit" ${submitState==='submitting'?'disabled':''}>${label}</button>${submitState==='unknown'?button('查询原请求','query-unknown')+button('放弃等待','abandon','link'):''}${submitState==='confirmed'?button('再派一单','new-draft','link'):''}</div></form></section><div class="stack" style="align-content:start"><section class="card"><h2>可靠交付，而非盲目重试</h2><div class="step"><span>1</span><p>提交确认意味着 Hub 已持久化。</p></div><div class="step"><span>2</span><p>Node 入账本后才接收，落盘后才执行。</p></div><div class="step"><span>3</span><p>断线继续执行，重连后补传结果。</p></div></section><section class="card"><h3>当前幂等键</h3><pre>${esc(draft.idem)}</pre><small>结果未知时输入与幂等键一同冻结，同键恢复不会创建重复任务。</small></section></div></div>`;
}
function submissionFeedback(){if(submitState==='unknown')return `<div class="notice warn"><b>结果未知 · unknown</b><br>没有收到提交确认；请求可能已持久化。表单与幂等键已冻结，请查询或同键重试。${esc(submitMessage)}</div>`;if(submitState==='failed')return `<div class="notice warn">明确失败 · rejected<br>${esc(submitMessage)}</div>`;if(submitState==='confirmed')return `<div class="notice">已确认 · confirmed<br>${esc(submitMessage)} · 下一步：查看任务。</div>`;return `<span class="muted">${submitState==='submitting'?'正在等待持久化确认 · submitting':'就绪 · ready · 提交后在「我的任务」查看进展'}</span>`;}
function taskPage(){
 const base=view==='hub'?tasks:mine();
 const list=base.filter(t=>(!filter||t.status===filter)&&(!traceFilter||t.trace_id.includes(traceFilter))&&(!byFilter||t.submitted_by===byFilter)&&(!errorFilter||t.error===errorFilter));
 return head(view==='hub'?'任务监管':'我的任务',view==='hub'?'全网只读监管；从异常下钻，以证据核对交付。':'跟踪每一次委托。点击任务，查看答复、诊断信息与产物。',button('↓ 导出 JSON','export'))+`<section class="card"><div class="row"><small>${view==='hub'?'此页只读 · 核对请到执行 node 本机':'提交方：mac-mini · 仅展示我的任务'}</small><small>终态保留 24h，请及时导出</small></div><div class="filters spaced">${`<button data-filter="" class="${!filter?'on':''}">全部 (${base.length})</button>`+Object.keys(states).map(s=>`<button data-filter="${s}" class="${filter===s?'on':''}">${badge(s)} ${base.filter(t=>t.status===s).length}</button>`).join('')}</div>${view==='hub'?`<div class="fields"><label>trace_id<input id="trace-filter" value="${esc(traceFilter)}" placeholder="搜索 trace_id"></label><label>提交方<select id="by-filter"><option value="">全部提交方</option>${nodes.map(n=>`<option ${byFilter===n.id?'selected':''}>${n.id}</option>`).join('')}</select></label><label>错误码<select id="error-filter"><option value="">全部错误码</option>${Object.entries(errors).map(([k,v])=>`<option value="${k}" title="${v}" ${errorFilter===k?'selected':''}>${k} — ${v}</option>`).join('')}</select></label></div><div class="filters">${Object.entries(errors).map(([k,v])=>`<button class="help ${errorFilter===k?'on':''}" data-error="${k}" title="${v}" aria-label="${k}：${v}">${k} ⓘ</button>`).join('')}</div>`:''}${list.length?taskTable(list):`<div class="empty"><h2>${base.length?'没有符合筛选的任务':'还没有派出任务'}</h2>${button(base.length?'清除筛选':'＋ 派任务',base.length?'clear-filters':'dispatch',base.length?'':'primary')}</div>`}<p class="footer-note">${list.length} 条记录 · 时间均为 UTC · needs_review 是独立终态，禁止自动重跑。</p></section>`;
}
function taskTable(list){return `<div class="table-wrap"><table><thead><tr><th>任务 / trace_id</th><th>目标能力</th><th>状态</th>${view==='hub'?'<th>提交方</th>':''}<th>操作</th></tr></thead><tbody>${list.map(t=>`<tr data-task="${t.id}" tabindex="0" aria-label="查看 ${esc(t.title)}"><td class="task-title"><strong>${esc(t.title)}</strong><small>${t.id} · ${t.trace_id}</small></td><td>${esc(t.target_agent)}<small>${t.target_node}</small></td><td>${badge(t.status)}${t.error?`<small class="help" title="${esc(errors[t.error]||'本机执行中断，需人工核对')}">${esc(t.error)} ⓘ</small>`:''}${t.review?'<small>已核对 · reviewed</small>':''}</td>${view==='hub'?`<td>${t.submitted_by}</td>`:''}<td class="table-action">${t.status==='failed'&&view==='node'?button('重试','retry','',`data-id="${t.id}"`):t.status==='running'?'<button disabled title="V0 不支持任务取消">取消 · V0 不支持</button>':t.status==='needs_review'?button(t.review?'查看核对':'去核对','detail','link',`data-id="${t.id}"`):button('查看 →','detail','link',`data-id="${t.id}"`)}</td></tr>`).join('')}</tbody></table></div>`;}
function servicePage(){return head('我的服务','决定本机哪些能力可以接受网内委托。',button('＋ 添加服务','config-guide','primary'))+`<div class="notice">完整配置（command/workdir/args）请编辑 node YAML。Web 仅演示接入开关；ExecProfile 永不出本机。</div><div class="grid cols2 spaced">${agents.filter(a=>a.node==='mac-mini').map(a=>`<section class="card"><div class="row"><div><h2>${a.id}</h2><small>${a.desc}</small></div><button role="switch" aria-label="${a.id} 接入开关" aria-checked="${a.desired}" class="toggle" data-action="toggle-service" data-agent="${a.id}" ${a.pending?'disabled':''}></button></div><p class="spaced"><span class="badge offered">${a.mode}</span></p><div class="three-states"><div>本机已配置<b>接入意愿：${a.desired?'开启':'关闭'}</b></div><div>待同步<b>${a.pending?'正在同步 · pending':'无待同步变更'}</b></div><div>网内生效<b>${a.exposed?'已接入 · exposed':'已下线 · hidden'}</b></div></div><div class="row"><small>调用统计 · 近 24h 窗口<br>2026-10-20 06:30 — 10-21 06:30 UTC</small><strong>${a.calls} 次</strong></div><p class="footer-note">停止暴露后新任务不再准入，已有任务继续执行至终态。</p></section>`).join('')}</div><p class="footer-note">统计窗口上限为终态保留的 24h，不代表长期累计。</p>`;}
function opsPage(){return head('运维','此页只读 · 查看本机健康与恢复线索。',button('复制诊断信息','diagnostics'))+`<div class="grid cols2"><section class="card"><h2>连接与同步</h2><div class="stack"><div class="row"><span>Hub 连接</span>${online(nodes[0])}</div><div class="row"><span>会话代次 · epoch</span><b>12</b></div><div class="row"><span>最近同步时间</span><code>2026-10-21T06:30:00Z</code></div><div class="row"><span>API 回环地址</span><code>127.0.0.1:8445</code></div></div></section><section class="card"><h2>执行账本三态</h2><div class="stack"><div class="row"><span>已接收 · accepted</span><b>1</b></div><div class="row"><span>已开始 · started</span><b>2</b></div><div class="row"><span>已结束 · finished</span><b>9</b></div></div><p class="footer-note">重启恢复：accepted 安全续执行；started 转待核对；finished 未确认重发结果。</p></section><section class="card"><h2>离线信箱余量</h2><div class="metric">97 <small>/ 100 条</small></div><p>已用 0.4 / 8 MiB</p><div class="bar"><span style="width:5%"></span></div></section><section class="card"><h2>诊断说明</h2><p class="muted">诊断信息含连接、epoch、账本计数与容量，不包含访问令牌和本机执行配置。</p><div class="notice">只读视图 · 不提供重启、清空账本或远程配置操作。</div></section></div>`;}

function controlPage(){return head('运维控制','使用 Hub 自有巡检 Agent，检查整个协作网。',button(inspection.stage==='running'?'巡检中…':'运行巡检','inspect','primary',inspection.stage==='running'?'disabled':''))+`<section class="card"><div class="row"><h2>全网健康巡检</h2><span class="badge offered">控制 node · 管理员批准</span></div><p class="notice">控制 node 需管理员批准登记。巡检 Agent 属于 hub 自有，不承载用户服务任务。</p><label>Hub 自有巡检 Agent<select id="inspector" ${inspection.stage==='running'?'disabled':''}><option>fleet-inspector @ hub-control — 只读健康巡检</option></select></label><div class="row"><h3>批量目标 · 自动快照</h3><small>${inspection.time||'点击运行时固定目标与准入状态'}</small></div><div class="grid cols3">${(inspection.snapshot.length?inspection.snapshot:nodes).map(n=>`<div class="node-line"><div><b>${n.id}</b><br><small>${n.online?'准入通过 · admitted':'跳过 · skipped（离线）'}</small></div>${online(n)}</div>`).join('')}</div><p class="footer-note">目标快照固定后不随在线状态漂移；按目标记录执行结果。</p></section>${inspection.stage==='idle'?`<section class="card spaced empty"><h2>报告会出现在这里</h2><p>运行后展示逐项结果，离线节点保留为明确的跳过项。</p></section>`:inspection.stage==='running'?`<section class="card spaced"><h2>执行中 · running</h2><p>已固定 3 个目标，正在收集已准入节点的健康信息…</p><div class="bar"><span style="width:65%"></span></div></section>`:`<section class="card spaced"><div class="row"><h2>汇总报告 · 已完成</h2><span class="badge completed">2 成功 · 1 跳过（离线）</span></div><p>mac-mini：连接正常，2 条待核对任务需主人确认。<br>studio-linux：连接正常，投递窗口 1/8，无阻塞。<br>travel-mac：离线，未执行巡检；不能据此认定健康。</p><div class="notice warn">部分目标未检查：travel-mac。恢复连接后再运行巡检。</div><div class="actions spaced">${button('下一步：查看节点 →','node-list','link')}${button('查看待核对任务 →','reviews','link')}${button('导出报告 JSON','export-inspection')}</div></section>`}`;}
function policyPage(){const rows=[['信箱条数','100 条 / node','submitted 计数，出队即释放'],['信箱字节预算','8 MiB / node','超额拒收：503 mailbox_full'],['Hub 任务存储','256 MiB 全局','含终态 24h 保留'],['单消息','1 MiB','完整 JSON 信封编码后计量'],['投递窗口','8 / node','offered + acknowledged'],['任务离线保留','7 天','到期未终态 → failed / expired'],['终态 / 产物保留','24h','产物从 result_ack 起计时'],['协议版本','v1','不兼容版本拒绝连接'],['执行并发','默认 2 / node','由 node 本机配置'],['单产物原始大小','≤ 640 KiB','最多 8 条引用，SHA-256 校验']];return head('策略容量','此页只读 · 所有额度与保留策略一目了然。',`<span class="readonly">只读</span>`)+`<div class="notice warn">高危变更走 hub 配置文件；执行配置由各 node 本机主人管理。</div><section class="card spaced"><table><thead><tr><th>策略</th><th>当前值</th><th>说明</th></tr></thead><tbody>${rows.map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table><p class="footer-note">低负载部署目标 ≤ 5 node；不承诺满配资源占用。此页没有写入操作。</p></section>`;}

function detail(id){
 const t=tasks.find(t=>t.id===id);if(!t)return;selectedTask=id;
 const needs=t.status==='needs_review',local=view==='node'&&t.target_node==='mac-mini';
 const intro=needs?'执行到一半机器重启了，结果不确定——等待本机主人核对，请勿重新提交':t.status==='completed'?'任务已完成，可以阅读最终答复并取回产物。':t.status==='failed'?'本次执行未完成，请先确认原因再创建新任务。':'任务仍在进行，请等待有证据的状态更新。';
 openLayer(`${modalHead('任务详情 · '+t.id)}<p class="${needs?'notice purple':'notice'}">${intro}</p><h2>${esc(t.title)}</h2><div class="row">${badge(t.status)}<small>${t.trace_id}</small></div><p class="muted spaced">${t.submitted_by} → ${t.target_agent} @ ${t.target_node}</p>${needs?`<section class="card"><h3>中断证据</h3><p>${esc(t.scene)}</p><code>账本 started → finished / node_restarted_midway</code>${t.review?`<div class="notice spaced">已核对 · reviewed<br>结论：${esc(t.review.conclusion)}<br>记录：${esc(t.review.note)}<br><small>${t.review.at} · 仅本次演示会话</small></div>${button('下一步：回到待办 →','review-return','link')}`:local?`<form id="review-form" class="spaced"><label>人工核对结论<select name="conclusion"><option>已确认执行完成</option><option>已确认未完成，已妥善处理残留</option></select></label><label>核对依据<textarea name="note" required placeholder="记录你检查的 git diff、数据库迁移记录或实际产物；不会自动重跑任务。"></textarea></label><p class="muted">仅记录核对意见，保留原 needs_review 终态；不会改成 failed 或自动重跑。</p><button class="primary" type="submit">记录核对结果</button></form>`:`<div class="notice warn spaced">请由 ${t.target_node} 的本机主人核对。监管视角无核对写权限。</div>${button('前往 Node 本地核对 →','local-review','link',`data-id="${t.id}"`)}`}</section>`:''}<h3 class="spaced">TaskInput · 任务输入</h3><pre>${esc(JSON.stringify(t.input,null,2))}</pre><h3>FinalAnswer · 最终答复</h3><p>${esc(t.answer)}</p><details><summary>stdout tail · 诊断日志</summary><pre>${esc(t.stdout)}</pre><small>诊断日志不代替最终答复，最多 64KiB。</small></details><h3 id="artifact-heading">Artifacts · 产物</h3>${t.artifacts.length?t.artifacts.map((a,i)=>`<div class="artifact row"><div><b>${esc(a.name)}</b><br><small>${a.state} ${a.source?'· 来源 '+a.source:''}</small></div>${a.state==='可取回'?button('取回','artifact','',`data-id="${t.id}" data-index="${i}"`):`<span class="badge ${a.state==='校验失败'?'failed':'offline'}">${a.state}</span>`}</div>`).join(''):'<p class="muted">暂无已登记产物。中断任务不推断存在可交付产物。</p>'}<p class="footer-note">取回经 node 本地 API 代理与 hub 中继；校验失败禁止交付。产物在 result_ack 后保留 24h。</p><h3 class="spaced">阶段示意时间线</h3><small>仅展示有证据的事件；缺失事件不补画。</small><ol class="timeline">${t.events.map(([e,time])=>`<li>${esc(e)}<br><small>${esc(time)}</small></li>`).join('')}</ol>${terminal(t)?`<div class="notice">终态保留 24h。${button('下一步：返回任务列表 →','all-tasks','link')}</div>`:''}<div class="actions spaced">${button('导出此任务 JSON','export-one','',`data-id="${t.id}"`)}${t.status==='failed'&&view==='node'?button('重试（创建新任务）','retry','',`data-id="${t.id}"`):''}</div>`,true);
 selectedTask=id;
}
function configGuide(){openLayer(`${modalHead('添加本机服务')}<p>完整配置（command/workdir/args）请编辑 node YAML。</p><ol><li>声明 CLI Agent，设置绝对 command / workdir 与权限模式。</li><li>按部署流程重启 node 读取配置。</li><li>回到「我的服务」打开接入开关，等待网内生效。</li></ol><pre>agents:\n  - name: my-reviewer\n    kind: cli\n    command: /absolute/path/to/agent\n    workdir: /absolute/path/to/workspace\n    agent_args: []\n    permission_mode: read-only\n    exposed: true\n    allow_args: false\n    allow_env: []\n    timeout_sec: 300</pre><p class="muted">配置示例需替换真实路径。V0 不做 Web 动态配置下发。</p>${button('下一步：查看我的服务 →','services','link')}`);}
let issuedConfig='',issuedNode='';
function enroll(){issuedConfig='';issuedNode='';openLayer(`${modalHead('生成接入配置 · 1 / 3')}<p>每台机器一个独立令牌，并绑定 node 身份。此向导为 Mock，不签发真实凭据。</p><form id="enroll-form"><label>新节点 ID<input name="node_id" required pattern="[a-z0-9][a-z0-9-]{1,31}" placeholder="例如 build-linux" autocomplete="off"></label><p id="enroll-feedback" role="status"></p><button class="primary" type="submit">批准登记并生成演示配置</button></form><p class="footer-note">控制 node 身份必须额外由管理员批准，禁止节点自报提权。</p>`);}
function issue(nodeId){issuedNode=nodeId;const token='mock-only-'+key();issuedConfig=`node_id: ${nodeId}\nhub_url: wss://hub.example:8443/ws/node\nregister_token: ${token}\nhub_pubkey_fp: "<填入经管理员核实的 SPKI SHA-256 指纹>"\napi_listen: 127.0.0.1:8445\ndata_dir: data/${nodeId}\nconcurrency: 2`;
 openLayer(`${modalHead('接入配置 · 2 / 3')}<div class="notice warn">token 单次展示，关闭后不可再次查看。请在离开前安全保存。仅为演示令牌。</div><label class="spaced">本次生成的 token<input readonly value="${esc(token)}"></label><h3>在目标机器保存 node 配置片段</h3><pre>${esc(issuedConfig)}</pre><ol><li>保存片段并补全经核实的证书指纹与本机 agents。</li><li>管理员在 hub 配置中登记同一 node_id/token。</li><li>启动 node，等待身份校验与上线确认。</li></ol><div class="actions">${button('复制配置片段','copy-config')}${button('已保存，等待节点上线','enroll-wait','primary')}</div>`);
}
function exportJSON(data,name){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出 · 下一步：继续查看任务或产物');}
async function copyText(value,label){try{await navigator.clipboard.writeText(value);toast(label+'已复制');}catch{openLayer(`${modalHead('手动复制'+label)}<p>浏览器未允许剪贴板访问，可选中以下内容复制。</p><textarea readonly rows="12">${esc(value)}</textarea>${button('完成，返回 →','close','link')}`);}}
function parseInput(){const args=JSON.parse(draft.args),env=JSON.parse(draft.env);if(!Array.isArray(args)||!args.every(a=>typeof a==='string'))throw Error('args 必须为字符串数组');if(!env||Array.isArray(env)||typeof env!=='object'||!Object.values(env).every(v=>typeof v==='string'))throw Error('env 必须为字符串键值对象');if(!draft.prompt.trim())throw Error('请填写任务描述');if(!available().some(a=>a.node+'/'+a.id===draft.agent))throw Error('目标服务不再暴露，请重新选择');return {args,env,stdin:draft.stdin||draft.prompt};}
function newTask(input){const [node,agent]=draft.agent.split('/');return {id:'t-'+String(tasks.length+1).padStart(4,'0'),trace_id:'trace-'+(7901+tasks.length),status:'submitted',title:draft.prompt,target_node:node,target_agent:agent,submitted_by:'mac-mini',input,idem:draft.idem,error:'',review:null,created_at:new Date().toISOString(),events:[['提交持久化 · submit_ack',new Date().toISOString()]],answer:'尚无已确认的最终答复。',stdout:'[diagnostic] awaiting delivery',artifacts:[]};}
function confirmTask(t,dup=false){if(!tasks.some(x=>x.id===t.id))tasks.unshift(t);confirmedId=t.id;submitState='confirmed';submitMessage=(dup?'同键命中原请求 · dup:true · ':'')+t.id+' / '+t.trace_id;uncertainTask=null;render();toast('提交已确认 · 下一步：查看任务');}
function submitTask(){
 if(submitState==='confirmed'){detail(confirmedId);return;}if(submitState==='submitting')return;
 if(submitState==='unknown'){const t=uncertainTask;submitState='submitting';render();toast('正在用冻结的原始请求同键重试');setTimeout(()=>confirmTask(t,true),650);return;}
 let input;try{input=parseInput();}catch(e){submitState='failed';submitMessage='400 bad_request · '+e.message;render();return;}
 const scenario=draft.scenario;submitState='submitting';submitMessage='';render();toast('提交中：已锁定表单，防止重复提交');
 setTimeout(()=>{if(['400','409','503'].includes(scenario)){submitState='failed';submitMessage={'400':'400 frame_too_large · 输入超过消息预算；请缩短后重试。','409':'409 conflict · 同键不同内容；修正后重试将自动生成新幂等键。','503':'503 mailbox_full · 对方信箱已满；可稍后修正响应场景再重试。'}[scenario];if(scenario==='409')draft.idem=key();render();toast('明确失败：请修正后重试');return;}
 const t=newTask(input);if(scenario==='unknown'){uncertainTask=t;submitState='unknown';render();toast('结果未知：表单和幂等键已冻结');}else confirmTask(t);
 },750);
}
function filteredTasks(){return (view==='hub'?tasks:mine()).filter(t=>(!filter||t.status===filter)&&(!traceFilter||t.trace_id.includes(traceFilter))&&(!byFilter||t.submitted_by===byFilter)&&(!errorFilter||t.error===errorFilter));}
function changeService(a){a.desired=!a.desired;a.pending=true;closeLayer();render();toast('本机意愿已保存 · 待同步 pending');setTimeout(()=>{a.exposed=a.desired;a.pending=false;if(auth.node&&view==='node'&&page==='services')render();toast(a.id+' 网内已生效 · 下一步：查看我的服务');},1600);}
function inspect(){if(inspection.stage==='running')return;inspection={stage:'running',snapshot:nodes.map(n=>({...n})),time:new Date().toISOString()};render();toast('目标快照已固定 · 2 准入，1 跳过（离线）');setTimeout(()=>{inspection.stage='done';if(view==='hub'&&page==='control')render();toast('巡检已完成 · 2 成功，1 跳过 · 下一步：查看节点');},1300);}
const actions={
 close:closeLayer,dispatch:()=>go('dispatch'),services:()=>go('services'),ops:()=>go('ops'),'node-list':()=>go('nodes'),'all-tasks':()=>go('tasks'),reviews:()=>go('tasks','needs_review'),'review-return':()=>go('tasks','needs_review'),
 'first-use':()=>{firstUse=!firstUse;render();},'config-guide':configGuide,enroll,revoke:b=>openLayer(`${modalHead('吊销 · '+esc(b.dataset.node))}<div class="notice warn">演示：V0 无撤销机制</div><p class="spaced">此按钮不改变节点或会话状态。自动签发、撤销与轮换属于后续阶段；请按实际部署流程由管理员处理 hub 配置。</p>${button('下一步：返回节点列表 →','close','link')}`),
 detail:b=>detail(b.dataset.id),retry:b=>{const t=tasks.find(t=>t.id===b.dataset.id);if(submitState==='unknown'||submitState==='submitting'){toast('原请求尚未确认，请先恢复结果未知的请求');go('dispatch');return;}freshDraft();draft.prompt=t.title;draft.stdin=t.input.stdin;draft.args=JSON.stringify(t.input.args);draft.env=JSON.stringify(t.input.env);if(available().some(a=>a.node===t.target_node&&a.id===t.target_agent))draft.agent=t.target_node+'/'+t.target_agent;go('dispatch');toast('已填入新任务草稿，使用新幂等键；请确认后提交');},
 'new-draft':()=>{freshDraft();render();},'query-unknown':()=>{if(submitState!=='unknown')return;toast('正在查询冻结的原请求');submitState='submitting';const t=uncertainTask;render();setTimeout(()=>confirmTask(t,true),600);},
 abandon:()=>openLayer(`${modalHead('放弃等待，不代表撤销请求')}<p>原请求可能已经执行。离开后仍保留冻结的表单和幂等键；回到「派任务」可查询或同键重试。</p><p class="notice warn">V0 不支持取消。请勿用新幂等键重复提交同一工作。</p>${button('保留原请求，查看我的任务','abandon-confirm','primary')}`),
 'abandon-confirm':()=>{go('tasks');toast('已保留冻结请求；返回派任务页可继续恢复');},
 'toggle-service':b=>{const a=agents.find(a=>a.id===b.dataset.agent);if(a.pending)return;if(a.desired)openLayer(`${modalHead('下线 '+a.id+'？')}<p class="notice warn">已有任务继续执行至终态</p><p>本机关闭接入后等待同步；新任务不再准入，已排队与运行中的任务继续执行。</p><div class="actions">${button('确认下线','confirm-off','primary',`data-agent="${a.id}"`)}${button('保持接入','close')}</div>`);else changeService(a);},
 'confirm-off':b=>changeService(agents.find(a=>a.id===b.dataset.agent)),
 diagnostics:()=>copyText(JSON.stringify({mock:true,node_id:'mac-mini',online:true,epoch:12,ledger:{accepted:1,started:2,finished:9},mailbox:{remaining:97,limit:100,used_mib:0.4,budget_mib:8},last_sync:'2026-10-21T06:30:00Z'},null,2),'诊断信息'),
 export:()=>exportJSON(filteredTasks(),'swarmmind-tasks.json'),'export-one':b=>exportJSON(tasks.find(t=>t.id===b.dataset.id),'swarmmind-'+b.dataset.id+'.json'),
 artifact:b=>{const t=tasks.find(t=>t.id===b.dataset.id),a=t.artifacts[Number(b.dataset.index)];if(a.state!=='可取回')return;const url=URL.createObjectURL(new Blob([a.content],{type:'text/markdown;charset=utf-8'})),link=document.createElement('a');link.href=url;link.download=a.name;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);openLayer(`${modalHead('产物已取回')}<p>${esc(a.name)} · SHA-256 校验通过（Mock）。</p>${button('下一步：查看全部产物 →','all-artifacts','link',`data-id="${t.id}"`)}`);},
 'all-artifacts':b=>{detail(b.dataset.id);$('#artifact-heading').scrollIntoView({block:'start'});},
 'local-review':b=>{const id=b.dataset.id;view='node';page='tasks';filter='needs_review';closeLayer();render();if(auth.node)detail(id);else toast('请先使用本机管理令牌登录，再打开待核对任务');},
 'copy-config':()=>copyText(issuedConfig,'接入配置'),
 'enroll-wait':()=>{const id=issuedNode;issuedConfig='';issuedNode='';openLayer(`${modalHead('等待上线 · 3 / 3')}<div class="notice">配置已交接 · 等待 ${esc(id)} 连接</div><p class="spaced">演示不会添加虚构的在线节点。真实部署中须完成服务端登记与 node 启动，上线后才能确认接入成功。</p><p class="muted">本次 token 已隐藏，关闭后不可再次查看。</p>${button('下一步：返回节点列表 →','node-list','link')}`);},
 inspect,'export-inspection':()=>exportJSON({mock:true,agent:'fleet-inspector',owner:'hub-control',snapshot:inspection.snapshot,at:inspection.time,summary:'2 成功 1 跳过（离线）'},'swarmmind-inspection.json'),
 'clear-filters':()=>{filter=traceFilter=byFilter=errorFilter='';render();}
};
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(b&&!b.disabled){toast('已响应 · '+b.textContent.trim().slice(0,38));}
 if(b?.dataset.view){if(submitState==='submitting'){toast('请求正在确认，请稍候再切换视角');return;}issuedConfig='';issuedNode='';closeLayer();view=b.dataset.view;page='overview';filter=traceFilter=byFilter=errorFilter='';render();return;}
 if(b?.dataset.page){go(b.dataset.page);return;}
 if(b?.id==='logout'){if(submitState==='submitting'){toast('请等待当前提交确认');return;}auth[view]=false;closeLayer();render();return;}
 if(b?.dataset.filter!==undefined){filter=b.dataset.filter;render();return;}
 if(b?.dataset.error){errorFilter=errorFilter===b.dataset.error?'':b.dataset.error;render();return;}
 if(b?.dataset.action){actions[b.dataset.action]?.(b);return;}
 if(!b){const tr=e.target.closest('[data-task]');if(tr){detail(tr.dataset.task);return;}if(e.target.dataset.backdrop){issuedConfig='';issuedNode='';closeLayer();}}
});
document.addEventListener('submit',e=>{
 e.preventDefault();if(e.target.id==='login-form'){if(!$('#token').value.trim()){$('#login-feedback').textContent='请输入非空访问令牌';return;}$('#login-feedback').textContent='正在验证演示令牌…';const loginView=view;e.target.querySelector('button').disabled=true;setTimeout(()=>{auth[loginView]=true;if(view===loginView)render();toast('登录成功 · 已进入控制台');},200);}
 if(e.target.id==='dispatch-form')submitTask();
 if(e.target.id==='enroll-form'){const id=new FormData(e.target).get('node_id').trim();if(nodes.some(n=>n.id===id)||id==='hub-control'){$('#enroll-feedback').textContent='该节点身份已登记，请使用独立的新 ID。';return;}issue(id);toast('演示配置已生成 · 请安全保存');}
 if(e.target.id==='review-form'){const t=tasks.find(t=>t.id===selectedTask),data=new FormData(e.target),note=data.get('note').trim();if(!note){toast('请填写核对依据');return;}t.review={conclusion:data.get('conclusion'),note,at:new Date().toISOString()};const id=t.id;render();detail(id);toast('核对已记录（Mock） · 下一步：回到待办');}
});
document.addEventListener('input',e=>{const k=e.target.dataset.draft;if(k&&!['unknown','submitting','confirmed'].includes(submitState)){draft[k]=e.target.value;if(k==='search'){const pos=e.target.selectionStart;render();const input=$('[data-draft="search"]');input.focus();input.setSelectionRange(pos,pos);}}if(e.target.id==='trace-filter'){const pos=e.target.selectionStart;traceFilter=e.target.value;render();$('#trace-filter').focus();$('#trace-filter').setSelectionRange(pos,pos);}});
document.addEventListener('change',e=>{const k=e.target.dataset.draft;if(k&&!['unknown','submitting','confirmed'].includes(submitState)){draft[k]=e.target.value;if(k==='agent')render();}if(e.target.id==='by-filter'){byFilter=e.target.value;render();}if(e.target.id==='error-filter'){errorFilter=e.target.value;render();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){issuedConfig='';issuedNode='';closeLayer();}const tr=e.target.closest('[data-task]');if(tr&&e.target===tr&&(e.key==='Enter'||e.key===' ')){e.preventDefault();detail(tr.dataset.task);}if(e.key==='Tab'&&$('#layer [role=dialog]')){const box=$('#layer [role=dialog]'),items=[...box.querySelectorAll('button:not(:disabled),a[href],input:not(:disabled),select:not(:disabled),textarea:not(:disabled),summary')].filter(el=>el.getClientRects().length);if(!items.length){e.preventDefault();return;}const first=items[0],last=items[items.length-1];if(e.shiftKey&&(document.activeElement===first||document.activeElement===box)){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
render();
</script>
