<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SwarmMind · 协作控制台 v3</title>
<style>
:root{--bg:#f7f6f3;--white:#fff;--ink:#252830;--muted:#83858e;--line:#eae9e5;--blue:#4a6cf7;--blue-bg:#eef2ff;--green:#288263;--green-bg:#edf7f1;--orange:#ab7420;--orange-bg:#fff5e4;--red:#c15555;--red-bg:#fff0ef;--shadow:0 8px 32px #292c3610}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
button,a,input,select,textarea{outline-offset:4px}
button:focus-visible,a:focus-visible{outline:2px solid var(--blue)}
a{color:var(--blue);text-decoration:none}
button{border:1px solid var(--line);background:white;color:var(--ink);border-radius:8px;padding:8px 13px;transition:.16s}
button:hover{background:#f5f6f9;border-color:#d7dae5}
button.primary{color:white;background:var(--blue);border-color:var(--blue);box-shadow:0 3px 8px #4a6cf71a}
button.primary:hover{background:#3d5ee4}
button.danger{color:var(--red);border-color:#efd4d1;background:#fff}
button.ghost{border-color:transparent;background:transparent}
button.small{padding:5px 10px;font-size:12px}
button.icon{padding:6px;display:grid;place-items:center;width:32px;height:32px}
svg{vertical-align:middle;flex-shrink:0}
header{height:76px;background:#ffffffec;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:20;backdrop-filter:blur(12px);gap:16px}
.brand{display:flex;align-items:center;gap:11px;font-size:20px;letter-spacing:-.7px;font-weight:720;white-space:nowrap}
.brandmark{background:var(--ink);color:white;border-radius:10px;width:34px;height:34px;display:grid;place-items:center}
.header-left,.header-right,.row{display:flex;align-items:center;gap:12px}
.divider{height:23px;width:1px;background:var(--line);margin:0 12px}
.views{display:flex;gap:3px;padding:4px;background:#f2f2f0;border-radius:10px}
.views button{font-size:12px;border:0;background:transparent;color:var(--muted);padding:7px 12px;white-space:nowrap}
.views button.active{color:var(--ink);background:white;box-shadow:0 1px 5px #0000000d}
.avatar{display:grid;place-items:center;background:#eef0fa;color:var(--blue);font-size:11px;font-weight:700;border:1px solid #dfe4fa;width:31px;height:31px;border-radius:50%}
.identity{font-size:12px}
.demo{font-size:10px;border:1px solid #e0dfd9;border-radius:5px;padding:2px 6px;color:#89867e;letter-spacing:.8px}
.layout{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:calc(100vh - 76px)}
aside{padding:28px 16px 20px;border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:76px;height:calc(100vh - 76px)}
.aside-label{font-size:10px;letter-spacing:1.6px;color:#999992;margin:0 12px 14px}
nav{display:flex;flex-direction:column;gap:5px}
nav button{text-align:left;border:0;display:flex;align-items:center;gap:11px;background:transparent;color:#71747b;padding:11px 13px;font-size:13px}
nav button.active{background:#eaeefe;color:var(--blue);font-weight:600}
nav button .count{margin-left:auto;background:#fff1d8;border-radius:5px;font-size:10px;padding:1px 6px;color:#a67b27}
.aside-foot{margin-top:auto;padding:18px 11px 0;font-size:11px;color:var(--muted)}
.aside-foot .connection{margin-bottom:10px;color:#64686e;display:flex;align-items:center;gap:6px}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;background:#409478;flex-shrink:0}
.dot.off{background:#aaaeb6}
main{padding:34px 40px 50px;max-width:1500px;width:100%;margin:0 auto;min-width:0}
.crumb{color:#94969d;font-size:11px;margin-bottom:18px;display:flex;gap:9px;align-items:center}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:27px}
h1{font-size:27px;letter-spacing:-1px;font-weight:650;margin:0 0 5px}
h2{font-size:15px;letter-spacing:-.2px;margin:0;font-weight:650}
h3{font-size:14px;margin:0;font-weight:620}
p{margin:0}
.subtitle{font-size:12px;color:var(--muted)}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:17px}
.section-head h2{display:flex;align-items:center;gap:8px}
.section-head .sub{font-weight:400;color:var(--muted);font-size:11px}
.card{background:white;border:1px solid var(--line);border-radius:12px;padding:22px}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:28px}
.metric{position:relative;overflow:hidden}
.metric-label{font-size:12px;color:#80828a;display:flex;align-items:center;justify-content:space-between}
.metric-value{font-size:32px;font-weight:630;letter-spacing:-1.3px;line-height:1.4;margin:9px 0 4px}
.metric-value span{font-size:13px;letter-spacing:0;font-weight:400;color:#a0a2aa;margin-left:5px}
.metric-foot{color:#9799a0;font-size:10px}
.metric-foot b{color:var(--green);font-weight:500}
.topology-head{display:flex;align-items:center;gap:10px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10px;border-radius:5px;padding:3px 7px;white-space:nowrap;font-weight:500}
.pill.green{color:var(--green);background:var(--green-bg)}
.pill.gray{color:#8b8d94;background:#f1f2f4}
.pill.blue{color:var(--blue);background:var(--blue-bg)}
.pill.orange{color:var(--orange);background:var(--orange-bg)}
.pill.red{color:var(--red);background:var(--red-bg)}
.node-grid,.agent-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.node-card{padding:20px;position:relative}
.node-icon{width:38px;height:38px;display:grid;place-items:center;background:#f5f5f3;border-radius:10px;color:#7b7e87}
.node-title{display:flex;align-items:center;gap:10px;margin-bottom:19px}
.node-title .pill{margin-left:auto}
.tiny{font-size:10px;color:var(--muted)}
.mono,code,pre{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.node-info{display:flex;justify-content:space-between;font-size:11px;color:#8d9097;border-top:1px solid #f2f2ee;padding-top:13px}
.node-info strong{font-weight:550;color:#5b5f68}
.node-stats{display:flex;gap:23px;margin-bottom:17px}
.node-stats b{display:block;font-size:19px;font-weight:600}
.node-stats span{font-size:10px;color:var(--muted)}
.split{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(260px,1fr);gap:22px;margin-top:26px}
.list-card{padding:21px 0 0;overflow:hidden}
.list-card>.section-head{padding:0 21px}
table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}
th{text-align:left;color:#93969f;font-size:10px;font-weight:500;background:#fafaf8;padding:12px 19px;border-bottom:1px solid var(--line)}
td{padding:15px 19px;border-bottom:1px solid #f0f0ed}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fcfcfe}
.table-wrap{overflow:auto}
.task-name{display:block;font-weight:550;max-width:270px;overflow:hidden;text-overflow:ellipsis;color:#41454f}
.task-id{display:block;font-size:9px;color:#999da6;margin-top:3px}
.text-button{padding:0;border:0;background:transparent;color:var(--blue);font-size:12px}
.text-button:hover{background:transparent;color:#2d4fe0}
.review-mini{padding:15px 0;border-bottom:1px solid var(--line)}
.review-mini:last-child{border:0;padding-bottom:0}
.review-mini p{font-size:12px;margin:7px 0}
.notice{padding:13px 15px;border-radius:8px;background:#f2f5ff;color:#68759f;font-size:11px;display:flex;align-items:flex-start;gap:9px}
.notice.orange{background:var(--orange-bg);color:#997032}
.notice.gray{background:#f4f4f1;color:#80817f}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.input-icon{position:relative;flex:1;min-width:180px}
.input-icon svg{position:absolute;top:12px;left:12px;color:#969aa4}
.input-icon input{padding-left:36px;width:100%}
input,select,textarea{background:white;border:1px solid #e3e4e8;border-radius:7px;padding:10px 11px;color:#424752;font-size:12px;min-width:0}
input:focus,textarea:focus,select:focus{outline:2px solid #4a6cf72b;border-color:#7890f8}

function validateTask(d){

const envelope={v:1,mid:'m-'+uid(),type:'task_offer',from:by,to:a.node,payload:{id:'t-'+uid(),target_node:a.node,target_agent:a.name,input}};

function submitTask(){

if(previous&&previous.signature!==d.signature)throw Error('409：相同幂等键对应了不同内容，请恢复原请求或另建任务');

if(!previous&&d.outcome==='failure')throw Error('policy_denied：Hub 明确拒绝本次演示请求，未创建任务');
if(!previous&&tasks.filter(t=>t.node===d.payload.node&&t.status==='submitted').length>=100)throw Error('mailbox_full：目标 node 信箱已满，未创建任务');
let t=previous;
if(!t){
const now=Date.now();
t={id:'t-'+uid(),trace:'tr-'+uid(),title:d.payload.input.stdin.split('\n')[0].slice(0,90),...clone(d.payload),status:'submitted',createdAt:now,time:stamp(now),idem:d.idem,signature:d.signature,answer:'',error:'',review:null,changedAt:now,artifact:'ready',uploadPending:false};

if(!state.connected){d.phase='unknown';return}
d.phase='confirmed';d.taskId=t.id;state.lastSync=Date.now();
}catch(error){d.phase='failed';d.error=error.message}
finally{if(state.view===view&&state.page==='dispatch')updateSubmitUI();syncChrome()}
},1000);

function filteredTasks(){
const q=state.taskSearch.trim().toLowerCase(),from=state.taskFrom?new Date(state.taskFrom).getTime():-Infinity,to=state.taskTo?new Date(state.taskTo).getTime()+59999:Infinity;
const list=taskBase().filter(t=>(state.taskStatus==='all'||t.status===state.taskStatus)&&(state.taskNode==='all'||t.node===state.taskNode)&&(state.taskBy==='all'||t.by===state.taskBy)&&(state.taskError==='all'||t.error===state.taskError)&&(!state.reviewOnly||(t.status==='needs_review'&&!t.review))&&t.createdAt>=from&&t.createdAt<=to&&(t.title+' '+t.id+' '+t.trace+' '+t.agent).toLowerCase().includes(q));
if(state.reviewOnly||state.taskStatus==='needs_review')list.sort((a,b)=>(a.reviewSince||a.createdAt)-(b.reviewSince||b.createdAt));
else list.sort((a,b)=>b.createdAt-a.createdAt);
return list;
}

function saveAgent(form,intent){
const f=new FormData(form),id=form.dataset.id,name=f.get('name').trim(),command=f.get('command').trim(),workdir=f.get('workdir').trim(),home=f.get('home').trim(),description=f.get('description').trim();
if(!name||!description)throw Error('名称与描述不能为空');
if(agents.some(a=>a.node===local&&a.name===name&&a.id!==id))throw Error('本机 Agent 名称已存在');
if(!absolute(command)||!absolute(workdir)||(home&&!absolute(home)))throw Error('命令、工作目录与非空配置目录须为绝对路径');
const args=stringArray(f.get('args')),env=stringArray(f.get('env')),mode=f.get('mode'),timeout=Number(f.get('timeout'));
if(!Number.isInteger(timeout)||timeout<1||timeout>86400)throw Error('超时须为 1 至 86400 的整数');
if(mode==='read-only'&&name==='codex'&&!(args.includes('--sandbox')&&args[args.indexOf('--sandbox')+1]==='read-only'))throw Error('codex 的 read-only 声明须对应 --sandbox read-only 固定参数');
if(mode==='plan'&&name==='claude-code'&&!(args.includes('--permission-mode')&&args[args.indexOf('--permission-mode')+1]==='plan'))throw Error('claude-code 的 plan 声明须对应 --permission-mode plan 固定参数');
const old=agents.find(a=>a.id===id);
const a={...old,id:old?.id||'a-'+uid(),name,node:local,command,workdir,home,args,env,timeout,mode,description,allow:f.has('allow'),exposed:old?.exposed||false,desired:old?.desired||false,registered:old?.registered||false,joined:old?.joined||'',today:old?.today||0,published:old?.published||null,pending:old?.pending||false};
if(old&&(a.exposed||a.desired)&&JSON.stringify({...old,changed:undefined})!==JSON.stringify({...a,changed:undefined}))a.pending=true;
if(old)agents[agents.indexOf(old)]=a;else agents.push(a);
closeModal();render();toast(name+' 本机配置已保存，接入开关保持不变');
if(intent==='join')askAgent(a,true);
}
function askAgent(a,desired=a.desired,syncOnly=false){
if(!a||a.node!==local)return;
const verb=syncOnly?'同步':desired?'接入':'下线';
a.pending=a.pending||syncOnly;
confirmOperation({
verb,object:a.name,danger:!desired,
impact:desired?'确认后向协作网发布此 Agent 的能力卡片，网内其他 node 可向它派单。执行配置保留于本机。':'撤回新的网内派单入口。已经开始的任务继续执行，登记和历史任务保留。',
detail:`<p class="tiny">${state.connected?'将同步本机配置及接入意愿，收到确认后才显示网内生效。':'Hub 不可达：本次仅记录本机接入意愿并标记待同步，恢复连接后还需确认同步。'}</p>`,
label:verb+' '+a.name,
fn:()=>{
a.desired=desired;
if(state.connected){a.exposed=desired;a.pending=false;a.published=cardOf(a);if(desired){a.registered=true;a.joined=a.joined||stamp(Date.now())}state.lastSync=Date.now()}
else a.pending=true;
closeModal();render();toast(a.name+(a.pending?' 接入意愿已保存在本机，待同步':desired?' 已接入，网内生效':' 已下线'));
}
});
}
const artifactLabels={ready:'可取回',offline:'来源离线暂不可取',cleaned:'已清理',invalid:'校验失败'};
function artifactState(t){
if(t.artifact==='cleaned'||t.artifact==='invalid')return t.artifact;
if(t.artifact==='offline'||!state.connected||!nodeBy(t.node)?.online)return 'offline';

}
function artifactContent(t){

const s=artifactState(t),descriptions={
ready:'来源可达，可取回并核验 SHA-256 后保存。',
offline:'来源节点离线或中继不可达，保留产物登记；恢复连接后可重试。',
cleaned:'产物文件已清理，登记信息仅供审计，无法再下载。',

return `<div class="card"><div class="row" style="justify-content:space-between"><h3>检查报告.txt</h3>${pill(artifactLabels[s],s==='ready'?'green':s==='invalid'?'red':s==='offline'?'orange':'')}</div>

}
function addNode(){
modal('生成节点接入配置',`<form id="node-config-form"><div class="notice">每 node 使用独立令牌并绑定 node_id。生成配置后，由节点主人在本机接入。</div><div class="field"><label for="new-node-id">Node ID</label><input id="new-node-id" name="node" required pattern="[a-zA-Z0-9][a-zA-Z0-9_-]{0,47}" placeholder="例如 studio-mac"></div><div class="modal-foot"><button type="button" data-act="close">取消</button><button class="primary">生成演示配置</button></div></form>`);
}
function scheduleHighlight(t){
setTimeout(()=>{
document.querySelectorAll('[data-task-row]').forEach(row=>{if(row.dataset.taskRow===t.id&&Date.now()-t.changedAt>=2000){row.classList.remove('changed');row.style.animationDelay=''}});
},2050);
}
function demoStatus(){
const list=filteredTasks(),t=list.find(t=>['submitted','offered','acknowledged','running'].includes(t.status)&&(state.connected||t.node===local&&t.status==='running'));
if(!t){toast(state.connected?'当前筛选中没有可推进的进行中任务':'断网时仅可演示本机已运行任务继续执行');return}
const next={submitted:'offered',offered:'acknowledged',acknowledged:'running',running:'completed'};
t.status=next[t.status];t.changedAt=Date.now();
if(t.status==='completed'){t.terminalAt=Date.now();t.answer='演示状态推进：执行已完成，finished 账本已保存。';t.uploadPending=!state.connected;t.artifact='ready'}
if(state.connected)state.lastSync=Date.now();
taskRows();syncChrome();scheduleHighlight(t);toast('演示：'+t.id+' → '+statusMap[t.status][0]);
}
function connectionToggle(){
captureDraft();state.connected=!state.connected;
const n=nodeBy(local);if(n)n.online=state.connected;
if(!state.connected){
agents.filter(a=>a.node===local&&(a.exposed||a.desired)).forEach(a=>a.pending=true);
}else{
state.lastSync=Date.now();tasks.forEach(t=>t.uploadPending=false);
}
render();
toast(state.connected?'连接已恢复，待同步 Agent 请在本机逐项确认；任务结果已补传（演示）':'Hub 连接中断，本机功能与进行中的执行继续可用');
}
function navigate(page){
if(page==='dispatch'&&!canDispatch()){toast(offlineHint);return}
captureDraft();closeModal();state.page=page;render();window.scrollTo(0,0);
}
function applyScene(value){
captureDraft();closeModal();
if(value==='error'){state.scene='error';render();return}
state.scene=value;state.receipts.clear();state.drafts={hub:null,node:null};resetTasks();
if(value==='empty'){
agents=[];tasks=[];nodes=[clone(initial.nodes[0])];nodes[0].online=state.connected;
state.localSearch='';state.nodeSearch='';state.registryNode='all';state.registryStatus='all';state.page='overview';
}else{
agents=clone(initial.agents);tasks=clone(initial.tasks);nodes=clone(initial.nodes);nodeBy(local).online=state.connected;
if(!state.connected)agents.filter(a=>a.node===local&&a.exposed).forEach(a=>a.pending=true);
}
render();toast(value==='empty'?'已进入首次使用演示':'已恢复初始 mock 数据');
}
function showReviewFilter(){
captureDraft();closeModal();resetTasks();state.taskTab='received';state.taskStatus='needs_review';state.reviewOnly=true;state.page='tasks';render();
}
async function downloadArtifact(id){
const t=tasks.find(t=>t.id===id);if(!t||artifactState(t)!=='ready'){toast('产物当前不可取回');return}
const bytes=new TextEncoder().encode('SwarmMind 演示报告\n'+t.id+'\n\n'+t.answer);
if(!globalThis.crypto?.subtle){toast('当前环境无法进行 SHA-256 校验，请通过 localhost 或 HTTPS 打开原型');return}
const hash=async b=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',b)),x=>x.toString(16).padStart(2,'0')).join('');
const expected=await hash(bytes),received=bytes.slice(),actual=await hash(received);
if(artifactState(t)!=='ready'){toast('来源状态已变化，请重新取回');return}
if(expected!==actual){t.artifact='invalid';detail(id,'artifacts');toast('校验失败，已阻止下载');return}
if(state.detailId===id&&$('#artifact-hash'))$('#artifact-hash').textContent='SHA-256：'+actual+' · 已校验 · '+bytes.length+' 字节';
const url=URL.createObjectURL(new Blob([received],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');
a.href=url;a.download='SwarmMind-'+t.id+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('演示产物已校验并生成下载');
}
document.addEventListener('click',e=>{
const b=e.target.closest('button');if(!b||b.disabled)return;
if(b.dataset.view){captureDraft();closeModal();state.view=b.dataset.view;state.page='overview';render();return}
if(b.dataset.page){navigate(b.dataset.page);return}
if(b.dataset.act==='close'){closeModal();return}
if(!state.auth[state.view]&&!['session','logout'].includes(b.dataset.act))return;
if(b.dataset.empty){
const act=b.dataset.empty;
if(act==='retry-load'){state.scene=tasks.length||agents.length?'normal':'empty';if(state.connected)state.lastSync=Date.now();render();toast('已重新加载演示列表')}
else if(act==='edit-agent')editAgent('new');
else if(act==='add-node')addNode();
else if(act==='reset-registry'){state.registryNode='all';state.registryStatus='all';registry()}
else if(act==='reset-nodes'){state.nodeSearch='';nodePage()}
else if(act==='reset-agents'){state.localSearch='';agentsPage()}
else if(act==='reset-tasks'){resetTasks();taskPage()}
else navigate(act);
return;
}
if(b.dataset.toggle){const a=agents.find(a=>a.id===b.dataset.toggle);askAgent(a,!a.desired);return}
if(b.dataset.syncAgent){const a=agents.find(a=>a.id===b.dataset.syncAgent);if(state.connected)askAgent(a,a.desired,true);return}
if(b.dataset.edit){editAgent(b.dataset.edit);return}
if(b.dataset.detail){detail(b.dataset.detail);return}
if(b.dataset.detailTab){detail(state.detailId,b.dataset.detailTab);return}
if(b.dataset.taskTab){state.taskTab=b.dataset.taskTab;resetTasks();taskPage();return}
if(b.dataset.review){reviewAction(b.dataset.id,b.dataset.review);return}
if(b.dataset.download){downloadArtifact(b.dataset.download).catch(error=>toast(error.message));return}
if(b.dataset.artifactRetry){
const t=tasks.find(t=>t.id===b.dataset.artifactRetry);
if(state.connected&&nodeBy(t.node)?.online)t.artifact='ready';
detail(t.id,'artifacts');toast(artifactState(t)==='ready'?'来源已恢复，可取回':'来源仍不可达，请稍后重试');return;
}
if(b.dataset.nodeDetail){
const n=nodeBy(b.dataset.nodeDetail);
modal('节点 · '+n.id,settings([['状态',n.revoked?'接入已撤销':n.online?'在线':'离线'],['系统',n.os],['epoch',n.epoch],['接入时间',n.time],['最近心跳',n.heartbeat]])+'<div class="notice" style="margin-top:18px">Agent 接入与下线由此节点本机管理。</div>');return;
}
if(b.dataset.revoke){
const n=nodeBy(b.dataset.revoke);
confirmOperation({verb:'吊销令牌',object:n.id,danger:true,label:'演示吊销 '+n.id,
impact:'仅模拟撤销入网凭证并断开节点会话。该节点停止接收新派单，Agent 登记保留，已有执行不被终止。演示：V0 无撤销机制。',
fn:()=>{n.revoked=true;n.online=false;n.heartbeat='演示吊销时';closeModal();render();toast(n.id+' 令牌吊销仅为演示，V0 无撤销机制')}});
return;
}
switch(b.dataset.act){
case 'confirm':{const fn=confirmAction;confirmAction=null;fn?.();break}
case 'refresh':captureDraft();if(state.connected)state.lastSync=Date.now();render();toast(state.connected?'已同步当前演示状态':'已刷新本机演示状态，Hub 仍不可达');break;
case 'connection':connectionToggle();break;
case 'review-filter':showReviewFilter();break;
case 'reset-registry':state.registryNode='all';state.registryStatus='all';registry();break;
case 'reset-tasks':resetTasks();taskPage();break;
case 'demo-status':demoStatus();break;
case 'new-draft':state.drafts[state.view]=null;dispatchPage();break;
case 'abandon-draft':{
const d=draft();
confirmOperation({verb:'放弃重试',object:d.idem,danger:true,label:'放弃重试并另建任务',
impact:'当前请求可能已经被 Hub 接收。放弃不会撤销原请求，另建任务使用新幂等键，可能重复执行并产生副作用。',
fn:()=>{state.drafts[state.view]=null;closeModal();dispatchPage()}});break;
}
case 'session':
captureDraft();modal('当前会话',`<p>${state.view==='hub'?'Hub 管理员':'mac-mini 本机主人'}</p><p class="tiny" style="margin-top:10px">演示数据只保留在页面内存，切换视角不会改变接入主权。派单草稿按视角分别保留。</p><div class="modal-foot"><button data-act="close">返回</button><button class="danger" data-act="logout">退出当前视角</button></div>`);break;
case 'logout':
confirmOperation({verb:'退出会话',object:state.view==='hub'?'Hub 管理员':'mac-mini 本机主人',danger:true,
impact:'退出当前控制台视角，任务执行和本机 Agent 接入状态继续保留。',label:'退出当前视角',
fn:()=>{state.auth[state.view]=false;closeModal();render()}});break;
case 'add-node':addNode();break;
}
});
document.addEventListener('input',e=>{
const el=e.target;
if(el.id==='local-search'){state.localSearch=el.value;agentCards()}
if(el.id==='node-search'){state.nodeSearch=el.value;nodeRows()}
if(el.id==='task-search'){state.taskSearch=el.value;taskRows()}
if(el.id==='target-search')fillTargets();
if(el.closest('#dispatch-form'))captureDraft();
});
document.addEventListener('change',e=>{
const el=e.target;
if(el.id==='demo-data'){applyScene(el.value);return}
if(el.id==='highlight-toggle'){
state.highlight=el.checked;
if(!el.checked)document.querySelectorAll('tr.changed').forEach(row=>{row.classList.remove('changed');row.style.animationDelay=''});
return;
}
if(el.id==='registry-node'){state.registryNode=el.value;registryRows()}
if(el.id==='registry-status'){state.registryStatus=el.value;registryRows()}
const filterKeys={'task-status':'taskStatus','task-node':'taskNode','task-by':'taskBy','task-error':'taskError','task-from':'taskFrom','task-to':'taskTo'};
if(filterKeys[el.id]){
state[filterKeys[el.id]]=el.value;
if(el.id==='task-status'&&el.value!=='needs_review')state.reviewOnly=false;
taskRows();
}
if(el.id==='target-node')fillTargets();
if(el.id==='target-agent')targetPreview();
if(el.closest('#dispatch-form'))captureDraft();
if(el.id==='retry-risk')$('#operation-confirm').disabled=!el.checked;
if(el.id==='artifact-demo'){const t=tasks.find(t=>t.id===state.detailId);t.artifact=el.value;detail(t.id,'artifacts')}
});
document.addEventListener('submit',e=>{
e.preventDefault();
try{
const form=e.target;
if(form.id==='login-form'){
const expected=state.view==='hub'?'hub_demo_admin':'node_demo_local';
if($('#login-token').value!==expected)throw Error('演示令牌不正确');
state.auth[state.view]=true;render();toast('已登录');return;
}
if(!state.auth[state.view])return;
if(form.id==='agent-form')saveAgent(form,e.submitter?.value||'save');
if(form.id==='dispatch-form')submitTask();
if(form.id==='node-config-form'){
const id=new FormData(form).get('node').trim();
if(nodes.some(n=>n.id===id))throw Error('Node ID 已存在，请使用新的 ID');
const token=randomToken(),config='node_id: '+id+'\nhub_url: wss://hub.swarm.example:8443/ws/node\nregister_token: '+token+'\nhub_pubkey_fp: "" # 首连核对并记录指纹\nconcurrency: 2\nagents: [] # 由本机主人配置并接入\n';
modal('演示配置 · '+id,`<div class="notice orange">此令牌仅由原型生成，未在真实 Hub 签发。演示不新增实际节点。</div><div class="field"><label for="generated-config">接入配置</label><textarea id="generated-config" rows="9" readonly class="mono">${esc(config)}</textarea></div><p class="tiny">点击配置框可全选复制。</p>`);
$('#generated-config').addEventListener('click',ev=>ev.target.select());
}
}catch(error){if($('#agent-error'))$('#agent-error').textContent=error.message;toast(error.message||'请检查输入内容')}
});
$('#modal').addEventListener('click',e=>{
if(e.target===$('#modal')){
const r=$('#modal').getBoundingClientRect();
if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal();
}
});
$('#modal').addEventListener('cancel',e=>{e.preventDefault();closeModal()});
render();
</script>
</body>
</html>

.modal-head h2{margin:0}
.modal-body{padding:24px;overflow:auto;max-height:calc(90vh - 80px)}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:23px}
#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#303646;color:white;padding:11px 20px;border-radius:9px;font-size:12px;z-index:30;box-shadow:0 5px 22px #0002;max-width:90vw}
#toast[hidden],[hidden]{display:none!important}
.result{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.9}
.review-card h3{margin:14px 0 7px}
.timeline{display:flex;gap:7px;margin:22px 0}
.timeline span{flex:1;background:#f1f2f5;border-radius:5px;padding:9px 3px;text-align:center;font-size:10px;color:#9ca1ac}
.timeline span.done{background:var(--blue);color:var(--primary)}
#sync-corner{position:fixed;right:16px;bottom:12px;z-index:6;background:#ffffffed;border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-size:10px;color:var(--muted);box-shadow:0 3px 14px #00000007}
#connection-banner{border-radius:0;margin:0;padding:12px 28px}
.demo-bar{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:10px 28px;background:#fbfbf9;border-bottom:1px solid var(--line);font-size:11px;color:var(--muted)}
.demo-bar select{width:auto;padding:5px 8px}
.demo-bar .check{margin-left:auto}
.demo-bar .check input{accent-color:var(--primary)}
.error-code{border-bottom:1px dotted var(--muted);cursor:help}
.review-record{white-space:normal;min-width:180px;max-width:260px;margin-top:6px}
.guide-step{display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.guide-step button{margin-top:auto}
.form-lock{border:0;margin:0;padding:0;min-width:0}
.form-lock:disabled{opacity:.72}
@keyframes task-flash{from{background:#edf4ff}to{background:transparent}}
tr.changed{animation:task-flash 2s ease-out both}
@media(prefers-reduced-motion:reduce){tr.changed{animation:none;background:#edf4ff}}
@media(max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.layout{grid-template-columns:190px minmax(0,1fr)}main{padding:28px 24px}.split{grid-template-columns:1fr}.metrics{gap:10px}.metric.card{padding:16px}.identity{display:none}}
@media(max-width:730px){header{padding:15px;flex-wrap:wrap}.brand{font-size:18px}.header-left{flex-wrap:wrap}.layout{display:block}aside{position:static;height:auto;padding:12px;border-right:0;border-bottom:1px solid var(--line)}.eyebrow,.aside-foot{display:none}nav{display:flex;overflow:auto}nav button{white-space:nowrap;padding:9px}.nav-icon{display:none}main{padding:24px 16px 64px}.metrics,.grid,.two,.form-grid{grid-template-columns:1fr 1fr}.grid,.two{grid-template-columns:1fr}.head{flex-wrap:wrap}.form-grid .field{grid-column:1/-1}.number{font-size:28px}.version{display:none}.row{gap:8px}.modal-body{padding:18px}.toolbar select{flex:1;max-width:none}.demo-bar{padding:10px 15px}.demo-bar .check{margin-left:0}#connection-banner{padding:12px 15px}.form-foot .row{flex-wrap:wrap}.header-right .identity{display:none}}
</style>
</head>
<body>
<header>
<div class="row header-left">
<div class="brand"><span class="logo">✳</span>SwarmMind <span class="version">原型 v4</span></div>
<div class="switcher" aria-label="控制台视角">
<button data-view="hub" class="active">Hub 中心端</button>
<button data-view="node">Node 本地控制台</button>
</div>
</div>
<div class="row header-right"><span id="network-pill"></span><span class="identity tiny" id="identity"></span><span class="avatar" id="avatar">H</span><button class="small" data-act="session">会话</button></div>
</header>
<div class="demo-bar">
<span class="version">交互演示</span>
<label for="demo-data">数据场景</label>
<select id="demo-data"><option value="normal">现有 mock 数据</option><option value="empty">首次使用 · 无数据</option><option value="error">列表加载失败</option></select>
<button class="small" data-act="connection" id="connection-toggle">模拟 Hub 断网</button>
<label class="check"><input id="highlight-toggle" type="checkbox" checked>状态变更柔和高亮 2s · 演示</label>
</div>
<div id="connection-banner" class="notice orange" role="status" hidden>Hub 连接中断：本机功能可用，经 Hub 的新派单已暂停，进行中的任务继续执行、结果待补传</div>
<div class="layout">
<aside>
<div class="eyebrow" id="scope"></div>
<nav id="nav" aria-label="页面导航"></nav>
<div class="aside-foot"><p id="aside-connection"></p><p style="margin-top:8px">接入由本机决定<br>任务由调用方明确指定</p><p style="margin-top:16px">交互原型 · 数据仅保留于当前页面<br>刷新恢复初始演示数据</p></div>
</aside>
<main><div class="crumb" id="crumb"></div><div id="content"></div></main>
</div>
<div id="sync-corner" role="status"></div>
<dialog id="modal" aria-labelledby="modal-title">
<div class="modal-head"><h2 id="modal-title"></h2><button data-act="close" aria-label="关闭弹层">×</button></div>
<div class="modal-body" id="modal-body"></div>
</dialog>
<div id="toast" role="status" aria-live="polite" hidden></div>

</body>
</html>
