function validateTask(d){

const payload={node:a.node,agent:a.name,by,input,origin:d.origin};

const envelope={v:1,mid:'m-'+uid(),type:'task_offer',from:by,to:a.node,payload:{id:'t-'+uid(),target_node:a.node,target_agent:a.name,input}};

function submitTask(){

d.phase='submitting';updateSubmitUI();

try{
const key=d.payload.by+'\0'+d.idem;
const previous=state.receipts.get(key)||tasks.find(t=>t.by===d.payload.by&&t.idem===d.idem);
if(previous&&previous.signature!==d.signature)throw Error('409：相同幂等键对应了不同内容，请恢复原请求或另建任务');
if(!previous&&!state.connected){d.phase='unknown';return}

if(!previous&&tasks.filter(t=>t.node===d.payload.node&&t.status==='submitted').length>=100)throw Error('mailbox_full：目标 node 信箱已满，未创建任务');

t={id:'t-'+uid(),trace:'tr-'+uid(),title:d.payload.input.stdin.split('\n')[0].slice(0,90),...clone(d.payload),status:'submitted',createdAt:now,time:stamp(now),idem:d.idem,signature:d.signature,answer:'',error:'',review:null,changedAt:now,artifact:'ready',uploadPending:false};

d.phase='confirmed';d.taskId=t.id;state.lastSync=Date.now();

function modal(title,html){

$('#modal-title').textContent=title;$('#modal-body').innerHTML=html;
if(!$('#modal').open)$('#modal').showModal();
}
function closeModal(){$('#modal').close();confirmAction=null;lastFocus?.focus?.()}
function confirmOperation({verb,object,impact,detail='',danger=false,label,fn,risk=false}){

modal(verb+' · '+object,`<div class="field"><span class="tiny">操作对象</span><h3 style="margin-top:5px">${esc(object)}</h3></div><div class="notice ${danger?'orange':''}"><b>影响说明</b><p style="margin-top:6px">${esc(impact)}</p></div>${detail}

}

function saveAgent(form,intent){
const f=new FormData(form),id=form.dataset.id,name=f.get('name').trim(),command=f.get('command').trim(),workdir=f.get('workdir').trim(),home=f.get('home').trim(),description=f.get('description').trim();
if(!name||!description)throw Error('名称与描述不能为空');
if(agents.some(a=>a.node===local&&a.name===name&&a.id!==id))throw Error('本机 Agent 名称已存在');
if(!absolute(command)||!absolute(workdir)||(home&&!absolute(home)))throw Error('命令、工作目录与非空配置目录须为绝对路径');
const args=stringArray(f.get('args')),env=stringArray(f.get('env')),mode=f.get('mode'),timeout=Number(f.get('timeout'));
if(!Number.isInteger(timeout)||timeout<1||timeout>86400)throw Error('超时须为 1 至 86400 的整数');
if(mode==='read-only'&&name==='codex'&&!(args.includes('--sandbox')&&args[args.indexOf('--sandbox')+1]==='read-only'))throw Error('codex 的 read-only 声明须对应 --sandbox read-only 固定参数');
if(mode==='plan'&&name==='claude-code'&&!(args.includes('--permission-mode')&&args[args.indexOf('--permission-mode')+1]==='plan'))throw Error('claude-code 的 plan 声明须对应 --permission-mode plan 固定参数');
const old=agents.find(a=>a.id===id);
const a={...old,id:old?.id||'a-'+uid(),name,node:local,command,workdir,home,args,env,timeout,mode,description,allow:f.has('allow'),exposed:old?.exposed||false,desired:old?.desired||false,registered:old?.registered||false,joined:old?.joined||'',today:old?.today||0,published:old?.published||null,pending:old?.pending||false};
if(old&&(a.exposed||a.desired)&&JSON.stringify({...old,changed:undefined})!==JSON.stringify({...a,changed:undefined}))a.pending=true;
if(old)agents[agents.indexOf(old)]=a;else agents.push(a);

async function downloadArtifact(id){
const t=tasks.find(t=>t.id===id);if(!t||artifactState(t)!=='ready'){toast('产物当前不可取回');return}
const bytes=new TextEncoder().encode('SwarmMind 演示报告\n'+t.id+'\n\n'+t.answer);
if(!globalThis.crypto?.subtle){toast('当前环境无法进行 SHA-256 校验，请通过 localhost 或 HTTPS 打开原型');return}
const hash=async b=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',b)),x=>x.toString(16).padStart(2,'0')).join('');
const expected=await hash(bytes),received=bytes.slice(),actual=await hash(received);
if(artifactState(t)!=='ready'){toast('来源状态已变化，请重新取回');return}
if(expected!==actual){t.artifact='invalid';detail(id,'artifacts');toast('校验失败，已阻止下载');return}
if(state.detailId===id&&$('#artifact-hash'))$('#artifact-hash').textContent='SHA-256：'+actual+' · 已校验 · '+bytes.length+' 字节';
const url=URL.createObjectURL(new Blob([received],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');
a.href=url;a.download='SwarmMind-'+t.id+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('演示产物已校验并生成下载');
}
document.addEventListener('click',e=>{

if(b.dataset.view){captureDraft();closeModal();state.view=b.dataset.view;state.page='overview';render();return}
if(b.dataset.page){navigate(b.dataset.page);return}
if(b.dataset.act==='close'){closeModal();return}
if(!state.auth[state.view]&&!['session','logout'].includes(b.dataset.act))return;
if(b.dataset.empty){
const act=b.dataset.empty;
if(act==='retry-load'){state.scene=tasks.length||agents.length?'normal':'empty';if(state.connected)state.lastSync=Date.now();render();toast('已重新加载演示列表')}
else if(act==='edit-agent')editAgent('new');
else if(act==='add-node')addNode();
else if(act==='reset-registry'){state.registryNode='all';state.registryStatus='all';registry()}
else if(act==='reset-nodes'){state.nodeSearch='';nodePage()}
else if(act==='reset-agents'){state.localSearch='';agentsPage()}
else if(act==='reset-tasks'){resetTasks();taskPage()}
else navigate(act);
return;
}
if(b.dataset.toggle){const a=agents.find(a=>a.id===b.dataset.toggle);askAgent(a,!a.desired);return}
if(b.dataset.syncAgent){const a=agents.find(a=>a.id===b.dataset.syncAgent);if(state.connected)askAgent(a,a.desired,true);return}
if(b.dataset.edit){editAgent(b.dataset.edit);return}
if(b.dataset.detail){detail(b.dataset.detail);return}
if(b.dataset.detailTab){detail(state.detailId,b.dataset.detailTab);return}
if(b.dataset.taskTab){state.taskTab=b.dataset.taskTab;resetTasks();taskPage();return}
if(b.dataset.review){reviewAction(b.dataset.id,b.dataset.review);return}
if(b.dataset.download){downloadArtifact(b.dataset.download).catch(error=>toast(error.message));return}
if(b.dataset.artifactRetry){
const t=tasks.find(t=>t.id===b.dataset.artifactRetry);
if(state.connected&&nodeBy(t.node)?.online)t.artifact='ready';
detail(t.id,'artifacts');toast(artifactState(t)==='ready'?'来源已恢复，可取回':'来源仍不可达，请稍后重试');return;
}
if(b.dataset.nodeDetail){
const n=nodeBy(b.dataset.nodeDetail);
modal('节点 · '+n.id,settings([['状态',n.revoked?'接入已撤销':n.online?'在线':'离线'],['系统',n.os],['epoch',n.epoch],['接入时间',n.time],['最近心跳',n.heartbeat]])+'<div class="notice" style="margin-top:18px">Agent 接入与下线由此节点本机管理。</div>');return;
}
if(b.dataset.revoke){
const n=nodeBy(b.dataset.revoke);
confirmOperation({verb:'吊销令牌',object:n.id,danger:true,label:'演示吊销 '+n.id,
impact:'仅模拟撤销入网凭证并断开节点会话。该节点停止接收新派单，Agent 登记保留，已有执行不被终止。演示：V0 无撤销机制。',
fn:()=>{n.revoked=true;n.online=false;n.heartbeat='演示吊销时';closeModal();render();toast(n.id+' 令牌吊销仅为演示，V0 无撤销机制')}});
return;
}
switch(b.dataset.act){
case 'confirm':{const fn=confirmAction;confirmAction=null;fn?.();break}
case 'refresh':captureDraft();if(state.connected)state.lastSync=Date.now();render();toast(state.connected?'已同步当前演示状态':'已刷新本机演示状态，Hub 仍不可达');break;
case 'connection':connectionToggle();break;
case 'review-filter':showReviewFilter();break;
case 'reset-registry':state.registryNode='all';state.registryStatus='all';registry();break;
case 'reset-tasks':resetTasks();taskPage();break;
case 'demo-status':demoStatus();break;
case 'new-draft':state.drafts[state.view]=null;dispatchPage();break;
case 'abandon-draft':{
const d=draft();
confirmOperation({verb:'放弃重试',object:d.idem,danger:true,label:'放弃重试并另建任务',
impact:'当前请求可能已经被 Hub 接收。放弃不会撤销原请求，另建任务使用新幂等键，可能重复执行并产生副作用。',
fn:()=>{state.drafts[state.view]=null;closeModal();dispatchPage()}});break;
}
case 'session':
captureDraft();modal('当前会话',`<p>${state.view==='hub'?'Hub 管理员':'mac-mini 本机主人'}</p><p class="tiny" style="margin-top:10px">演示数据只保留在页面内存，切换视角不会改变接入主权。派单草稿按视角分别保留。</p><div class="modal-foot"><button data-act="close">返回</button><button class="danger" data-act="logout">退出当前视角</button></div>`);break;
case 'logout':
confirmOperation({verb:'退出会话',object:state.view==='hub'?'Hub 管理员':'mac-mini 本机主人',danger:true,
impact:'退出当前控制台视角，任务执行和本机 Agent 接入状态继续保留。',label:'退出当前视角',
fn:()=>{state.auth[state.view]=false;closeModal();render()}});break;
case 'add-node':addNode();break;
}
});
document.addEventListener('input',e=>{
const el=e.target;
if(el.id==='local-search'){state.localSearch=el.value;agentCards()}
if(el.id==='node-search'){state.nodeSearch=el.value;nodeRows()}
if(el.id==='task-search'){state.taskSearch=el.value;taskRows()}
if(el.id==='target-search')fillTargets();
if(el.closest('#dispatch-form'))captureDraft();
});
document.addEventListener('change',e=>{
const el=e.target;
if(el.id==='demo-data'){applyScene(el.value);return}
if(el.id==='highlight-toggle'){
state.highlight=el.checked;
if(!el.checked)document.querySelectorAll('tr.changed').forEach(row=>{row.classList.remove('changed');row.style.animationDelay=''});
return;
}
if(el.id==='registry-node'){state.registryNode=el.value;registryRows()}
if(el.id==='registry-status'){state.registryStatus=el.value;registryRows()}
const filterKeys={'task-status':'taskStatus','task-node':'taskNode','task-by':'taskBy','task-error':'taskError','task-from':'taskFrom','task-to':'taskTo'};
if(filterKeys[el.id]){
state[filterKeys[el.id]]=el.value;
if(el.id==='task-status'&&el.value!=='needs_review')state.reviewOnly=false;
taskRows();
}
if(el.id==='target-node')fillTargets();
if(el.id==='target-agent')targetPreview();
if(el.closest('#dispatch-form'))captureDraft();
if(el.id==='retry-risk')$('#operation-confirm').disabled=!el.checked;
if(el.id==='artifact-demo'){const t=tasks.find(t=>t.id===state.detailId);t.artifact=el.value;detail(t.id,'artifacts')}
});
document.addEventListener('submit',e=>{
e.preventDefault();
try{
const form=e.target;
if(form.id==='login-form'){
const expected=state.view==='hub'?'hub_demo_admin':'node_demo_local';
if($('#login-token').value!==expected)throw Error('演示令牌不正确');
state.auth[state.view]=true;render();toast('已登录');return;
}
if(!state.auth[state.view])return;
if(form.id==='agent-form')saveAgent(form,e.submitter?.value||'save');
if(form.id==='dispatch-form')submitTask();
if(form.id==='node-config-form'){
const id=new FormData(form).get('node').trim();
if(nodes.some(n=>n.id===id))throw Error('Node ID 已存在，请使用新的 ID');
const token=randomToken(),config='node_id: '+id+'\nhub_url: wss://hub.swarm.example:8443/ws/node\nregister_token: '+token+'\nhub_pubkey_fp: "" # 首连核对并记录指纹\nconcurrency: 2\nagents: [] # 由本机主人配置并接入\n';
modal('演示配置 · '+id,`<div class="notice orange">此令牌仅由原型生成，未在真实 Hub 签发。演示不新增实际节点。</div><div class="field"><label for="generated-config">接入配置</label><textarea id="generated-config" rows="9" readonly class="mono">${esc(config)}</textarea></div><p class="tiny">点击配置框可全选复制。</p>`);
$('#generated-config').addEventListener('click',ev=>ev.target.select());
}
}catch(error){if($('#agent-error'))$('#agent-error').textContent=error.message;toast(error.message||'请检查输入内容')}
});
$('#modal').addEventListener('click',e=>{
if(e.target===$('#modal')){
const r=$('#modal').getBoundingClientRect();
if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal();
}
});
$('#modal').addEventListener('cancel',e=>{e.preventDefault();closeModal()});
render();
</script>

9. truncated 错误码入映射；任务详情标注「V0 不支持取消（V0.5 backlog）」
